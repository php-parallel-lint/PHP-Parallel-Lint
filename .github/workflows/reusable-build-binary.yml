name: Build Binary

on:
  workflow_call:
    inputs:
      use-cache:
        description: "Whether to use the Box PHAR cache"
        required: false
        type: boolean
        default: true

jobs:
  bundle:
    name: Build binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: exif, phar, openssl, sodium
          coverage: none
          ini-values: phar.readonly=Off, error_reporting=-1, display_errors=On, display_startup_errors=On, zend.assertions=1
          # Autoload files generated with Composer 2.3 are not compatible with PHP < 7.0.
          tools: composer:2.2
        env:
          fail-fast: true

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--no-dev"
          # Bust the cache at least once a month - output format: YYYY-MM.
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Get latest Box version
        id: box-version
        run: |
          latest_url=$(curl -Ls -o /dev/null -w '%{url_effective}' https://github.com/box-project/box/releases/latest)
          echo "version=${latest_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Cache Box PHAR
        id: cache-box
        if: inputs.use-cache
        uses: actions/cache/restore@v4
        with:
          path: box.phar
          key: box-phar-${{ steps.box-version.outputs.version }}

      - name: Install Box
        if: ${{ !inputs.use-cache || steps.cache-box.outputs.cache-hit != 'true' }}
        run: wget https://github.com/box-project/box/releases/latest/download/box.phar -O box.phar

      - name: Save Box PHAR cache
        if: inputs.use-cache && steps.cache-box.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: box.phar
          key: box-phar-${{ steps.box-version.outputs.version }}

      - name: Set Box permissions
        run: chmod 0755 box.phar

      # Note: do NOT turn on the requirement checker in the box config as it is no longer
      # compatible with PHP < 7.2.
      - name: Validate configuration
        run: php box.phar validate -i box.json

      - name: Building binary...
        run: php box.phar compile -v --config=box.json

      - name: Show info about the build phar with box-project/box
        run: php box.phar info -l parallel-lint.phar

      - name: Upload PHAR to workflow summary
        uses: actions/upload-artifact@v7
        with:
          name: parallel-lint-phar
          path: ./parallel-lint.phar
